<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANP Lehrveranstaltungsplaner</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --primary: #6b4f9e;
    --primary-dark: #52397d;
    --text: #2b2a28;
    --muted: #746f68;
    --border: #e3ddd4;
    --danger: #b5482f;
    --accent: #6b4f9e;
    --accent-light: #f1eefc;
    --success: #4a7a5b;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }

  /* ---------- Setup-Banner (identisch zu ANP_Lehrauftraege / ANP_Jahresplan) ---------- */
  #setup-banner { background:#fef9c3; border-bottom:1px solid #fde68a; padding:12px 24px; font-size:13px; display:none; }
  #setup-banner h3 { margin-bottom:8px; font-size:14px; }
  .setup-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:6px; }
  .setup-input { flex:1; min-width:200px; border:1px solid #fde68a; border-radius:6px; padding:6px 10px; font-size:12px; font-family:inherit; outline:none; background:white; }
  .setup-input:focus { border-color:#d97706; }
  .btn-setup { background:#d97706; color:white; border:none; border-radius:6px; padding:6px 14px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .btn-setup:hover { opacity:.85; }
  .setup-help { font-size:11px; color:#92400e; margin-top:6px; }
  .setup-help a { color:#92400e; }

  /* ---------- Header (identisch zu den Schwesterseiten) ---------- */
  header { background:var(--card); border-bottom:1px solid var(--border); padding:16px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; position:sticky; top:0; z-index:100; box-shadow:var(--shadow); }
  .header-left { display:flex; align-items:center; gap:12px; }
  .logo { width:36px; height:36px; background:var(--accent); border-radius:8px; display:flex; align-items:center; justify-content:center; color:white; font-weight:700; font-size:16px; flex-shrink:0; }
  header h1 { font-size:18px; font-weight:700; margin:0; }
  header h1 span { color:var(--muted); font-weight:400; font-size:14px; margin-left:6px; }
  .header-right { display:flex; align-items:center; gap:10px; }
  .cross-link { font-size:12.5px; color:var(--muted); text-decoration:none; padding:4px 9px; border-radius:6px; border:1px solid var(--border); }
  .cross-link:hover { background:var(--bg); color:var(--text); }
  #sync-status { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); padding:3px 9px; border-radius:20px; border:1px solid var(--border); background:var(--bg); white-space:nowrap; }
  #sync-dot { width:7px; height:7px; border-radius:50%; background:#cbd5e1; }
  #sync-dot.ok { background:#10b981; }
  #sync-dot.syncing { background:#f59e0b; animation:pulse .8s infinite; }
  #sync-dot.error { background:#dc2626; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  #btn-settings { background:none; border:1px solid var(--border); border-radius:6px; padding:4px 8px; cursor:pointer; font-size:14px; color:var(--muted); transition:background .15s; }
  #btn-settings:hover { background:var(--border); }

  /* ---------- App-Layout ---------- */
  #app { display: flex; min-height: calc(100vh - 65px); }
  .sidebar {
    width: 230px;
    background: var(--primary-dark);
    color: #fff;
    padding: 24px 0;
    flex-shrink: 0;
  }
  .sidebar h1 {
    font-size: 15px;
    padding: 0 20px 20px;
    margin: 0;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    font-weight: 600;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    cursor: pointer;
    color: rgba(255,255,255,0.8);
    font-size: 14.5px;
    border-left: 3px solid transparent;
  }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .nav-item.active { background: rgba(255,255,255,0.1); color: #fff; border-left-color: #d98c3f; font-weight: 600; }
  .nav-sep { height: 1px; background: rgba(255,255,255,0.12); margin: 14px 20px; }
  main {
    flex: 1;
    padding: 32px 40px;
    max-width: 1100px;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  h2 { margin: 0; font-size: 22px; }
  .btn {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 9px 16px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn.secondary { background: #fff; color: var(--primary); border: 1px solid var(--border); }
  .btn.secondary:hover { background: var(--accent-light); }
  .btn.danger { background: #fff; color: var(--danger); border: 1px solid #e8c9c1; }
  .btn.danger:hover { background: #fbeeeb; }
  .btn.small { padding: 5px 11px; font-size: 12.5px; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
  }
  .card h3 { margin: 0 0 6px; font-size: 16px; }
  .card .meta { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .tag {
    display: inline-block;
    background: var(--accent-light);
    color: var(--primary-dark);
    border-radius: 20px;
    padding: 2px 10px;
    font-size: 11.5px;
    margin: 2px 4px 2px 0;
  }
  .tag.orange { background: #fbe9d6; color: #8a5a1e; }
  .tag.green { background: #e4f0e7; color: var(--success); }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    background: #fff;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; font-weight: 600; }
  input[type=text], input[type=number], textarea, select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
  }
  textarea { resize: vertical; min-height: 60px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(30,25,20,0.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 150;
  }
  .modal {
    background: #fff; border-radius: var(--radius); padding: 26px 28px;
    width: 480px; max-width: 92vw; max-height: 88vh; overflow-y: auto;
  }
  .modal h3 { margin-top: 0; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab {
    padding: 10px 16px; cursor: pointer; font-size: 14px; color: var(--muted);
    border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
  .list-item {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px;
    background: #fff;
  }
  .list-item .content { flex: 1; }
  .list-item .content .title { font-weight: 600; font-size: 14.5px; margin-bottom: 4px; }
  .list-item .content .sub { font-size: 12.5px; color: var(--muted); }
  .back-link { color: var(--primary); cursor: pointer; font-size: 13.5px; margin-bottom: 10px; display: inline-block; }
  .back-link:hover { text-decoration: underline; }
  .badge-vorlage { background: #d98c3f; color: #fff; padding: 2px 9px; border-radius: 20px; font-size: 11px; margin-left: 8px; }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .chip {
    padding: 6px 13px; border-radius: 20px; border: 1px solid var(--border); background: #fff;
    font-size: 13px; cursor: pointer; color: var(--muted);
  }
  .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  table input[type=text] { padding: 6px 8px; font-size: 13px; }
  table td, table th { vertical-align: top; }
  #loading { text-align: center; padding: 60px; color: var(--muted); font-size: 14px; }
  @media print {
    table input[type=text] { border: none; background: transparent; padding: 2px 0; }
    header, .sidebar, .topbar .btn-row, .no-print { display: none !important; }
    main { padding: 0; max-width: 100%; }
    body { background: #fff; }
  }
</style>
</head>
<body>

<div id="setup-banner">
  <h3>☁️ Supabase einrichten – Geräteübergreifende Synchronisation</h3>
  <div class="setup-row">
    <input class="setup-input" id="sb-url" placeholder="Project URL (z.B. https://abcxyz.supabase.co)" autocomplete="off">
    <input class="setup-input" id="sb-key" placeholder="Anon / Public Key" autocomplete="off">
    <button class="btn-setup" id="btn-save-setup">Verbinden</button>
    <button class="btn-setup" style="background:#64748b" id="btn-skip-setup">Nur lokal</button>
  </div>
  <div class="setup-help">
    Project URL und Anon Key findest du in deinem Supabase-Projekt unter <strong>Settings → API</strong>.
    <a href="https://supabase.com" target="_blank">→ supabase.com</a>
  </div>
</div>

<header>
  <div class="header-left">
    <div class="logo">V</div>
    <h1>Lehrveranstaltungsplaner <span>Didaktische Planung</span></h1>
  </div>
  <div class="header-right">
    <a class="cross-link" href="./ANP_Lehrauftraege.html">← Externe Lehraufträge</a>
    <a class="cross-link" href="./ANP_Jahresplan.html">Jahresplan</a>
    <div id="sync-status"><span id="sync-dot"></span><span id="sync-text">lokal</span></div>
    <button id="btn-settings" title="Supabase-Einstellungen">⚙️</button>
  </div>
</header>

<div id="loading">Lade Daten …</div>
<div id="app" style="display:none"></div>

<script>
/* ---------- Datenmodell ---------- */
const LOCAL_CACHE_KEY = "anp_lvplaner_cache";
const REMOTE_KEY = "anp_lvplaner_state";

const TAXONOMIE_STUFEN = ["Erinnern", "Verstehen", "Anwenden", "Analysieren", "Bewerten", "Erschaffen"];
const KOMPETENZ_TYPEN = ["Fachkompetenz", "Methodenkompetenz", "Sozialkompetenz", "Selbstkompetenz"];
const METHODEN_KATEGORIEN = ["Wissensvermittlung", "Aktivierung", "Anwendung", "Reflexion & Feedback", "Selbststudium", "Austausch"];
const PRUEFUNGSFORMEN = ["Klausur (schriftlich)", "Mündliche Prüfung", "Hausarbeit", "Projektarbeit", "Portfolio", "Präsentation / Referat", "Take-Home Exam", "Multiple-Choice-Test", "Praktische Prüfung", "Peer-Assessment", "Lerntagebuch", "Fallstudienbearbeitung"];
const MEDIEN_OPTIONEN = ["Beamer / Präsentation", "Whiteboard / Tafel", "Flipchart", "Handout / Arbeitsblatt", "Laptop / Tablet (Studierende)", "Moodle / LMS", "Audio / Video", "Padlet / digitales Whiteboard", "Skript / Lehrbuch", "Mentimeter / Kahoot"];

function seedMethods() {
  return [
    { id: uid(), name: "Impulsvortrag / Vorlesung", beschreibung: "Kompakte Wissensvermittlung durch die Lehrperson, ggf. mit Folien.", gruppengroesse: "Plenum", zeitbedarf: "15–45 Min.", kategorie: "Wissensvermittlung", custom: false },
    { id: uid(), name: "Think-Pair-Share", beschreibung: "Einzeln nachdenken, dann mit Partner:in austauschen, danach im Plenum teilen.", gruppengroesse: "Einzeln/Paar/Plenum", zeitbedarf: "10–15 Min.", kategorie: "Aktivierung", custom: false },
    { id: uid(), name: "Gruppenarbeit", beschreibung: "Bearbeitung einer Aufgabe in Kleingruppen mit anschließender Ergebnispräsentation.", gruppengroesse: "3–6 Personen", zeitbedarf: "20–40 Min.", kategorie: "Aktivierung", custom: false },
    { id: uid(), name: "Fallstudienarbeit", beschreibung: "Analyse und Diskussion eines realitätsnahen Falls in Kleingruppen.", gruppengroesse: "Kleingruppen", zeitbedarf: "45–90 Min.", kategorie: "Anwendung", custom: false },
    { id: uid(), name: "Diskussion / Debatte", beschreibung: "Strukturierter Meinungsaustausch oder Pro-Contra-Debatte im Plenum.", gruppengroesse: "Plenum", zeitbedarf: "20–30 Min.", kategorie: "Reflexion & Feedback", custom: false },
    { id: uid(), name: "Peer Review", beschreibung: "Studierende geben sich gegenseitig strukturiertes Feedback zu Arbeitsergebnissen.", gruppengroesse: "Paare", zeitbedarf: "15–20 Min.", kategorie: "Reflexion & Feedback", custom: false },
    { id: uid(), name: "Flipped Classroom", beschreibung: "Wissensvermittlung im Selbststudium vorab, Präsenzzeit für Anwendung/Vertiefung.", gruppengroesse: "Selbststudium + Plenum", zeitbedarf: "variabel", kategorie: "Selbststudium", custom: false },
    { id: uid(), name: "Projektarbeit", beschreibung: "Längerfristige, selbstständige Bearbeitung eines Projekts in Kleingruppen.", gruppengroesse: "Kleingruppen", zeitbedarf: "mehrere Wochen", kategorie: "Anwendung", custom: false },
    { id: uid(), name: "Rollenspiel / Simulation", beschreibung: "Praxisnahe Simulation einer Situation zur Anwendung von Wissen und Fertigkeiten.", gruppengroesse: "Kleingruppen", zeitbedarf: "20–45 Min.", kategorie: "Anwendung", custom: false },
    { id: uid(), name: "Quiz (z.B. Kahoot)", beschreibung: "Spielerische Wiederholung und Aktivierung von Wissen mit direktem Feedback.", gruppengroesse: "Plenum", zeitbedarf: "10 Min.", kategorie: "Aktivierung", custom: false },
    { id: uid(), name: "World Café", beschreibung: "Rotierender Austausch an mehreren Thementischen in wechselnden Kleingruppen.", gruppengroesse: "Kleingruppen, rotierend", zeitbedarf: "30–60 Min.", kategorie: "Austausch", custom: false },
    { id: uid(), name: "One-Minute Paper", beschreibung: "Kurzes schriftliches Feedback am Ende der Sitzung (Kernpunkt & offene Frage).", gruppengroesse: "Einzeln", zeitbedarf: "5 Min.", kategorie: "Reflexion & Feedback", custom: false }
  ];
}

function defaultState() { return { courses: [], methods: seedMethods() }; }

function migrateState(s) {
  (s.courses || []).forEach(c => {
    if (!c.sitzungen) c.sitzungen = [];
    (c.lernziele || []).forEach(z => {
      if (!z.methodenIds) z.methodenIds = [];
      if (z.pruefungsform === undefined) z.pruefungsform = "";
    });
  });
}

function tryParse(s) { try { return s ? JSON.parse(s) : null; } catch { return null; } }

function uid() {
  return "id-" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}

let state = null;

/* ---------- Supabase-Sync (gleiches Projekt/Muster wie Externe Lehraufträge & Jahresplan) ---------- */
let sb = null;

(function seedCredentials() {
  if (!localStorage.getItem('sb_url')) {
    localStorage.setItem('sb_url', 'https://rshzagxtsftdairoyfil.supabase.co');
  }
  if (!localStorage.getItem('sb_key')) {
    localStorage.setItem('sb_key', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJzaHphZ3h0c2Z0ZGFpcm95ZmlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3ODY0MzksImV4cCI6MjA5ODM2MjQzOX0.waKxJ8w1fZICa4t2oWImJuk4nWcuDlAeTT7Dcpmt5RM');
  }
})();

function getSbCreds() {
  return { url: localStorage.getItem('sb_url') || '', key: localStorage.getItem('sb_key') || '' };
}

function initSupabase() {
  const { url, key } = getSbCreds();
  if (url && key) {
    try { sb = supabase.createClient(url, key); setSyncStatus('ok', 'verbunden'); return true; }
    catch { sb = null; }
  }
  setSyncStatus('off', 'lokal'); return false;
}

function setSyncStatus(state, text) {
  const dot = document.getElementById('sync-dot'), txt = document.getElementById('sync-text');
  if (!dot) return;
  dot.className = state === 'ok' ? 'ok' : state === 'syncing' ? 'syncing' : state === 'error' ? 'error' : '';
  txt.textContent = text;
}

async function dbGet(key) {
  if (!sb) return null;
  try {
    const { data, error } = await sb.from('plan_data').select('data').eq('key', key).maybeSingle();
    if (error || !data) return null;
    return data.data;
  } catch { return null; }
}

async function dbSet(key, value) {
  if (!sb) return;
  setSyncStatus('syncing', 'synchronisiert …');
  try {
    const { error } = await sb.from('plan_data').upsert({ key, data: value, updated_at: new Date().toISOString() }, { onConflict: 'key' });
    if (error) throw error;
    setSyncStatus('ok', 'synchronisiert');
  } catch (e) { console.warn('Sync error:', e); setSyncStatus('error', 'Sync-Fehler'); }
}

async function loadAll() {
  if (sb) {
    setSyncStatus('syncing', 'lädt …');
    const remote = await dbGet(REMOTE_KEY);
    state = remote || tryParse(localStorage.getItem(LOCAL_CACHE_KEY)) || defaultState();
    localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(state));
    setSyncStatus('ok', 'synchronisiert');
  } else {
    state = tryParse(localStorage.getItem(LOCAL_CACHE_KEY)) || defaultState();
  }
  migrateState(state);
}

function saveState() {
  localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(state));
  dbSet(REMOTE_KEY, state);
}

/* ---------- Setup-Banner UI ---------- */
function showSetupBanner() {
  document.getElementById('setup-banner').style.display = 'block';
  const { url, key } = getSbCreds();
  document.getElementById('sb-url').value = url;
  document.getElementById('sb-key').value = key;
}
function hideSetupBanner() { document.getElementById('setup-banner').style.display = 'none'; }

document.getElementById('btn-save-setup').addEventListener('click', async () => {
  const url = document.getElementById('sb-url').value.trim(), key = document.getElementById('sb-key').value.trim();
  if (!url || !key) { alert('Bitte beide Felder ausfüllen.'); return; }
  localStorage.setItem('sb_url', url); localStorage.setItem('sb_key', key);
  hideSetupBanner(); initSupabase();
  document.getElementById('loading').style.display = 'block';
  document.getElementById('app').style.display = 'none';
  await loadAll(); render();
});
document.getElementById('btn-skip-setup').addEventListener('click', () => {
  hideSetupBanner();
});
document.getElementById('btn-settings').addEventListener('click', () => showSetupBanner());

/* ---------- Routing / UI-State ---------- */
let route = { view: "kurse", id: null, tab: "uebersicht" };
let methodFilter = "Alle";

/* ---------- Kurs-Hilfsfunktionen ---------- */
function newCourse(overrides) {
  return Object.assign({
    id: uid(),
    titel: "Neue Lehrveranstaltung",
    kurzbeschreibung: "",
    semester: "",
    ects: "",
    sws: "",
    zielgruppe: "",
    istVorlage: false,
    lernziele: [],
    methoden: [],
    sitzungen: []
  }, overrides || {});
}

function getCourse(id) { return state.courses.find(c => c.id === id); }

function duplicateCourse(id, alsVorlage) {
  const orig = getCourse(id);
  if (!orig) return;
  const copy = JSON.parse(JSON.stringify(orig));
  copy.id = uid();
  copy.istVorlage = !!alsVorlage;
  copy.titel = alsVorlage ? orig.titel + " (Vorlage)" : orig.titel + " (Kopie)";
  copy.lernziele = copy.lernziele.map(z => Object.assign({}, z, { id: uid(), methodenIds: (z.methodenIds || []).slice() }));
  copy.methoden = copy.methoden.map(m => Object.assign({}, m));
  copy.sitzungen = (copy.sitzungen || []).map(s => Object.assign({}, s, {
    id: uid(),
    schritte: (s.schritte || []).map(st => Object.assign({}, st, { id: uid() }))
  }));
  state.courses.push(copy);
  saveState();
  return copy.id;
}

/* ---------- Rendering ---------- */
function render() {
  document.getElementById('loading').style.display = 'none';
  const app = document.getElementById("app");
  app.style.display = 'flex';
  app.innerHTML = `
    ${renderSidebar()}
    <main>${renderMain()}</main>
  `;
}

function renderSidebar() {
  const items = [
    { key: "kurse", label: "📚 Kurse" },
    { key: "vorlagen", label: "🗂 Vorlagen" },
    { key: "methoden", label: "🧩 Methodenbaukasten" }
  ];
  return `
    <div class="sidebar">
      <h1>Navigation</h1>
      ${items.map(it => `
        <div class="nav-item ${route.view === it.key ? 'active' : ''}" onclick="goTo('${it.key}')">${it.label}</div>
      `).join("")}
      <div class="nav-sep"></div>
      <div class="nav-item" onclick="exportBackup()">⬇️ Backup exportieren</div>
      <div class="nav-item" onclick="document.getElementById('importFile').click()">⬆️ Backup importieren</div>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importBackup(event)">
    </div>
  `;
}

function goTo(view, id, tab) {
  if (!(view === "kursdetail" && tab === "lernziele")) {
    editingLernzielId = null;
  }
  route = { view, id: id || null, tab: tab || "uebersicht" };
  render();
}

function renderMain() {
  if (route.view === "kurse") return renderCourseList(false);
  if (route.view === "vorlagen") return renderCourseList(true);
  if (route.view === "methoden") return renderMethodLibrary();
  if (route.view === "kursdetail") return renderCourseDetail();
  return "";
}

/* ---------- Kursliste ---------- */
function renderCourseList(vorlagenView) {
  const list = state.courses.filter(c => !!c.istVorlage === vorlagenView);
  const title = vorlagenView ? "Vorlagen" : "Meine Lehrveranstaltungen";
  const addLabel = vorlagenView ? "+ Neue Vorlage" : "+ Neue Lehrveranstaltung";

  const cards = list.map(c => `
    <div class="card">
      <h3 style="cursor:pointer" onclick="goTo('kursdetail','${c.id}')">${escapeHtml(c.titel)}</h3>
      <div class="meta">${[c.semester, c.ects ? c.ects + " ECTS" : "", c.sws ? c.sws + " SWS" : ""].filter(Boolean).join(" · ") || "Keine Angaben"}</div>
      <div>
        <span class="tag">${c.lernziele.length} Lernziel${c.lernziele.length === 1 ? "" : "e"}</span>
        <span class="tag orange">${c.methoden.length} Methode${c.methoden.length === 1 ? "" : "n"}</span>
        <span class="tag green">${(c.sitzungen || []).length} Sitzung${(c.sitzungen || []).length === 1 ? "" : "en"}</span>
      </div>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn small secondary" onclick="goTo('kursdetail','${c.id}')">Öffnen</button>
        ${vorlagenView
          ? `<button class="btn small secondary" onclick="useTemplate('${c.id}')">Als neuen Kurs verwenden</button>`
          : `<button class="btn small secondary" onclick="duplicateCourse('${c.id}', true); render();">Als Vorlage speichern</button>`
        }
        <button class="btn small danger" onclick="confirmDeleteCourse('${c.id}')">Löschen</button>
      </div>
    </div>
  `).join("");

  return `
    <div class="topbar">
      <h2>${title}</h2>
      <div class="btn-row">
        <button class="btn" onclick="createCourse(${vorlagenView})">${addLabel}</button>
      </div>
    </div>
    ${list.length ? `<div class="grid">${cards}</div>` : `<div class="empty">${vorlagenView ? "Noch keine Vorlagen vorhanden. Speichere einen Kurs als Vorlage oder lege hier eine neue an." : "Noch keine Lehrveranstaltungen angelegt. Leg direkt los oder starte aus einer Vorlage."}</div>`}
  `;
}

function createCourse(alsVorlage) {
  const c = newCourse({ istVorlage: !!alsVorlage });
  state.courses.push(c);
  saveState();
  goTo("kursdetail", c.id, "uebersicht");
}

function useTemplate(id) {
  const newId = duplicateCourse(id, false);
  goTo("kursdetail", newId, "uebersicht");
}

function confirmDeleteCourse(id) {
  const c = getCourse(id);
  if (!c) return;
  if (confirm(`"${c.titel}" wirklich löschen? Das kann nicht rückgängig gemacht werden.`)) {
    state.courses = state.courses.filter(x => x.id !== id);
    saveState();
    render();
  }
}

/* ---------- Kursdetail ---------- */
function renderCourseDetail() {
  const c = getCourse(route.id);
  if (!c) return `<div class="empty">Kurs nicht gefunden.</div>`;

  const tabs = [
    { key: "uebersicht", label: "Übersicht" },
    { key: "lernziele", label: "Lernziele & Kompetenzen" },
    { key: "methoden", label: "Methoden" },
    { key: "ablauf", label: "Ablaufplan" }
  ];

  let body = "";
  if (route.tab === "uebersicht") body = renderTabUebersicht(c);
  else if (route.tab === "lernziele") body = renderTabLernziele(c);
  else if (route.tab === "methoden") body = renderTabMethoden(c);
  else if (route.tab === "ablauf") body = renderTabAblauf(c);

  return `
    <span class="back-link" onclick="goTo('${c.istVorlage ? 'vorlagen' : 'kurse'}')">← Zurück zur Übersicht</span>
    <div class="topbar">
      <h2>${escapeHtml(c.titel)} ${c.istVorlage ? '<span class="badge-vorlage">Vorlage</span>' : ''}</h2>
      <div class="btn-row no-print">
        <button class="btn secondary" onclick="window.print()">🖨 Drucken / PDF</button>
      </div>
    </div>
    <div class="tabs">
      ${tabs.map(t => `<div class="tab ${route.tab === t.key ? 'active' : ''}" onclick="goTo('kursdetail','${c.id}','${t.key}')">${t.label}</div>`).join("")}
    </div>
    ${body}
  `;
}

function renderTabUebersicht(c) {
  return `
    <div class="card">
      <label>Titel</label>
      <input type="text" value="${attr(c.titel)}" oninput="updateCourseField('${c.id}','titel',this.value)">
      <div class="row3">
        <div>
          <label>Semester</label>
          <input type="text" placeholder="z.B. WS 2026/27" value="${attr(c.semester)}" oninput="updateCourseField('${c.id}','semester',this.value)">
        </div>
        <div>
          <label>ECTS</label>
          <input type="text" value="${attr(c.ects)}" oninput="updateCourseField('${c.id}','ects',this.value)">
        </div>
        <div>
          <label>SWS</label>
          <input type="text" value="${attr(c.sws)}" oninput="updateCourseField('${c.id}','sws',this.value)">
        </div>
      </div>
      <label>Zielgruppe</label>
      <input type="text" placeholder="z.B. Bachelor BWL, 3. Semester" value="${attr(c.zielgruppe)}" oninput="updateCourseField('${c.id}','zielgruppe',this.value)">
      <label>Kurzbeschreibung / Inhalte</label>
      <textarea rows="5" oninput="updateCourseField('${c.id}','kurzbeschreibung',this.value)">${escapeHtml(c.kurzbeschreibung)}</textarea>
    </div>
  `;
}

function updateCourseField(id, field, value) {
  const c = getCourse(id);
  if (!c) return;
  c[field] = value;
  saveState();
}

/* ---------- Tab: Lernziele & Kompetenzen (Constructive Alignment) ---------- */
let editingLernzielId = null;

function renderTabLernziele(c) {
  const editing = editingLernzielId ? c.lernziele.find(z => z.id === editingLernzielId) : null;

  const methodCheckboxes = state.methods.map(m => `
    <label style="display:flex; align-items:center; gap:6px; font-weight:400; margin:4px 0; font-size:13.5px;">
      <input type="checkbox" class="lz-methode-cb" value="${m.id}" ${editing && editing.methodenIds.includes(m.id) ? "checked" : ""}>
      ${escapeHtml(m.name)}
    </label>
  `).join("");

  const items = c.lernziele.map(z => {
    const methodNames = (z.methodenIds || []).map(id => {
      const m = state.methods.find(x => x.id === id);
      return m ? m.name : null;
    }).filter(Boolean);
    const complete = methodNames.length > 0 && (z.pruefungsform || "").trim().length > 0;
    return `
    <div class="list-item">
      <div class="content">
        <div class="title">${escapeHtml(z.text)}</div>
        <div class="sub" style="margin-bottom:8px">
          <span class="tag">${z.taxonomie}</span>
          <span class="tag green">${z.kompetenz}</span>
        </div>
        <div class="sub" style="line-height:1.9">
          <strong>Lehr-/Lernaktivität:</strong>
          ${methodNames.length ? methodNames.map(n => `<span class="tag orange">${escapeHtml(n)}</span>`).join(" ") : '<em>keine zugeordnet</em>'}
          <br>
          <strong>Prüfungsform:</strong> ${z.pruefungsform ? escapeHtml(z.pruefungsform) : '<em>nicht festgelegt</em>'}
        </div>
        <div style="margin-top:8px">
          ${complete
            ? '<span class="tag green">✓ konstruktiv ausgerichtet</span>'
            : '<span class="tag orange">⚠ Ausrichtung unvollständig</span>'}
        </div>
      </div>
      <div class="btn-row" style="flex-direction:column">
        <button class="btn small secondary" onclick="editLernziel('${c.id}','${z.id}')">Bearbeiten</button>
        <button class="btn small danger" onclick="removeLernziel('${c.id}','${z.id}')">Entfernen</button>
      </div>
    </div>
  `;
  }).join("");

  return `
    <div class="card" style="margin-bottom:18px">
      <div class="hint" style="margin-bottom:12px">
        Constructive Alignment: Lernziel, Lehr-/Lernaktivität und Prüfungsform sollen aufeinander abgestimmt sein –
        was gelernt werden soll, sollte auch geübt und in gleicher Form geprüft werden.
      </div>
      <label>${editing ? "Lernziel bearbeiten" : "Neues Lernziel"}</label>
      <textarea id="new-lernziel-text" rows="2" placeholder="z.B. Studierende können die zentralen Theorien X anwenden, um Y zu analysieren.">${editing ? escapeHtml(editing.text) : ""}</textarea>
      <div class="row2">
        <div>
          <label>Taxonomiestufe (Bloom)</label>
          <select id="new-lernziel-taxonomie">
            ${TAXONOMIE_STUFEN.map(t => `<option value="${t}" ${editing && editing.taxonomie === t ? "selected" : ""}>${t}</option>`).join("")}
          </select>
        </div>
        <div>
          <label>Kompetenztyp</label>
          <select id="new-lernziel-kompetenz">
            ${KOMPETENZ_TYPEN.map(k => `<option value="${k}" ${editing && editing.kompetenz === k ? "selected" : ""}>${k}</option>`).join("")}
          </select>
        </div>
      </div>
      <label>Lehr-/Lernaktivität(en) (aus Methodenbaukasten)</label>
      <div style="max-height:150px; overflow-y:auto; border:1px solid var(--border); border-radius:6px; padding:8px 12px; background:#fafafa;">
        ${methodCheckboxes || '<span class="hint">Noch keine Methoden im Baukasten vorhanden.</span>'}
      </div>
      <label>Prüfungsform / Assessment</label>
      <input type="text" id="new-lernziel-pruefung" list="pruefungsform-optionen" placeholder="z.B. Klausur, mündliche Prüfung, Projektarbeit..." value="${editing ? attr(editing.pruefungsform) : ""}">
      <datalist id="pruefungsform-optionen">
        ${PRUEFUNGSFORMEN.map(p => `<option value="${p}">`).join("")}
      </datalist>
      <div class="btn-row" style="margin-top:14px">
        <button class="btn" onclick="saveLernziel('${c.id}')">${editing ? "Aktualisieren" : "+ Lernziel hinzufügen"}</button>
        ${editing ? `<button class="btn secondary" onclick="cancelEditLernziel()">Abbrechen</button>` : ""}
      </div>
    </div>
    ${items || `<div class="empty">Noch keine Lernziele definiert.</div>`}
  `;
}

function saveLernziel(courseId) {
  const c = getCourse(courseId);
  const text = document.getElementById("new-lernziel-text").value.trim();
  if (!text) return;
  const taxonomie = document.getElementById("new-lernziel-taxonomie").value;
  const kompetenz = document.getElementById("new-lernziel-kompetenz").value;
  const pruefungsform = document.getElementById("new-lernziel-pruefung").value.trim();
  const methodenIds = Array.from(document.querySelectorAll(".lz-methode-cb:checked")).map(cb => cb.value);

  if (editingLernzielId) {
    const z = c.lernziele.find(z => z.id === editingLernzielId);
    Object.assign(z, { text, taxonomie, kompetenz, pruefungsform, methodenIds });
    editingLernzielId = null;
  } else {
    c.lernziele.push({ id: uid(), text, taxonomie, kompetenz, pruefungsform, methodenIds });
  }
  saveState();
  goTo("kursdetail", courseId, "lernziele");
}

function editLernziel(courseId, zielId) {
  editingLernzielId = zielId;
  goTo("kursdetail", courseId, "lernziele");
}

function cancelEditLernziel() {
  editingLernzielId = null;
  render();
}

function removeLernziel(courseId, zielId) {
  const c = getCourse(courseId);
  c.lernziele = c.lernziele.filter(z => z.id !== zielId);
  if (editingLernzielId === zielId) editingLernzielId = null;
  saveState();
  render();
}

/* ---------- Tab: Methoden (Kurszuordnung) ---------- */
function renderTabMethoden(c) {
  const assigned = c.methoden.map(m => {
    const method = state.methods.find(x => x.id === m.methodId);
    if (!method) return "";
    return `
      <div class="list-item">
        <div class="content">
          <div class="title">${escapeHtml(method.name)}</div>
          <div class="sub">${method.gruppengroesse} · ${method.zeitbedarf} · <span class="tag">${method.kategorie}</span></div>
          ${m.notiz ? `<div class="sub" style="margin-top:6px">📝 ${escapeHtml(m.notiz)}</div>` : ""}
        </div>
        <button class="btn small danger" onclick="removeMethodFromCourse('${c.id}','${m.methodId}')">Entfernen</button>
      </div>
    `;
  }).join("");

  const available = state.methods.filter(m => !c.methoden.some(cm => cm.methodId === m.id));

  return `
    <div class="card" style="margin-bottom:18px">
      <label>Methode aus Baukasten zuordnen</label>
      <select id="new-method-select">
        ${available.map(m => `<option value="${m.id}">${m.name}</option>`).join("")}
      </select>
      <label>Notiz (optional, z.B. für welche Sitzung/Phase)</label>
      <input type="text" id="new-method-notiz" placeholder="z.B. Einsatz in Sitzung 4">
      <div class="btn-row" style="margin-top:14px">
        <button class="btn" onclick="addMethodToCourse('${c.id}')" ${available.length ? "" : "disabled"}>+ Methode zuordnen</button>
        <button class="btn secondary" onclick="goTo('methoden')">Methodenbaukasten öffnen</button>
      </div>
      ${available.length ? "" : `<div class="hint">Alle vorhandenen Methoden sind bereits zugeordnet. Lege im Methodenbaukasten weitere an.</div>`}
    </div>
    ${assigned || `<div class="empty">Diesem Kurs sind noch keine Methoden zugeordnet.</div>`}
  `;
}

function addMethodToCourse(courseId) {
  const c = getCourse(courseId);
  const select = document.getElementById("new-method-select");
  if (!select || !select.value) return;
  const notiz = document.getElementById("new-method-notiz").value.trim();
  c.methoden.push({ methodId: select.value, notiz });
  saveState();
  goTo("kursdetail", courseId, "methoden");
}

function removeMethodFromCourse(courseId, methodId) {
  const c = getCourse(courseId);
  c.methoden = c.methoden.filter(m => m.methodId !== methodId);
  saveState();
  render();
}

/* ---------- Tab: Unterrichtsablaufplan ---------- */
function renderTabAblauf(c) {
  const sitzungenHtml = c.sitzungen.map((s, idx) => renderSitzung(c, s, idx)).join("");
  return `
    <div class="hint" style="margin-bottom:14px">
      Halte für jede Sitzung den zeitlichen Ablauf mit Inhalten, Methode und eingesetzten Medien fest.
    </div>
    ${sitzungenHtml || `<div class="empty">Noch keine Sitzung angelegt.</div>`}
    <div class="btn-row no-print" style="margin-top:10px">
      <button class="btn" onclick="addSitzung('${c.id}')">+ Neue Sitzung</button>
    </div>
    <datalist id="medien-optionen">
      ${MEDIEN_OPTIONEN.map(m => `<option value="${m}">`).join("")}
    </datalist>
    <datalist id="methoden-optionen">
      ${state.methods.map(m => `<option value="${attr(m.name)}">`).join("")}
    </datalist>
  `;
}

function renderSitzung(c, s, idx) {
  const rows = s.schritte.map((st, i) => `
    <tr>
      <td style="width:110px"><input type="text" value="${attr(st.zeit)}" placeholder="09:00–09:15" oninput="updateSchrittField('${c.id}','${s.id}','${st.id}','zeit',this.value)"></td>
      <td><input type="text" value="${attr(st.inhalt)}" placeholder="Inhalt / Phase" oninput="updateSchrittField('${c.id}','${s.id}','${st.id}','inhalt',this.value)"></td>
      <td style="width:190px"><input type="text" value="${attr(st.methode)}" list="methoden-optionen" placeholder="Methode" oninput="updateSchrittField('${c.id}','${s.id}','${st.id}','methode',this.value)"></td>
      <td style="width:190px"><input type="text" value="${attr(st.medien)}" list="medien-optionen" placeholder="Medien" oninput="updateSchrittField('${c.id}','${s.id}','${st.id}','medien',this.value)"></td>
      <td class="no-print" style="width:110px; white-space:nowrap">
        <button class="btn small secondary" title="Nach oben" onclick="moveSchritt('${c.id}','${s.id}','${st.id}',-1)" ${i === 0 ? "disabled" : ""}>↑</button>
        <button class="btn small secondary" title="Nach unten" onclick="moveSchritt('${c.id}','${s.id}','${st.id}',1)" ${i === s.schritte.length - 1 ? "disabled" : ""}>↓</button>
        <button class="btn small danger" onclick="removeSchritt('${c.id}','${s.id}','${st.id}')">✕</button>
      </td>
    </tr>
  `).join("");

  return `
    <div class="card" style="margin-bottom:18px">
      <div class="row2">
        <div>
          <label>Sitzung / Thema</label>
          <input type="text" value="${attr(s.titel)}" placeholder="z.B. Sitzung 1: Einführung" oninput="updateSitzungField('${c.id}','${s.id}','titel',this.value)">
        </div>
        <div>
          <label>Datum (optional)</label>
          <input type="text" value="${attr(s.datum)}" placeholder="z.B. 05.10.2026" oninput="updateSitzungField('${c.id}','${s.id}','datum',this.value)">
        </div>
      </div>
      <table style="width:100%; border-collapse:collapse; margin-top:14px; font-size:13.5px">
        <thead>
          <tr style="text-align:left; color:var(--muted); font-size:12.5px">
            <th style="padding:4px">Zeit</th>
            <th style="padding:4px">Inhalte</th>
            <th style="padding:4px">Methode</th>
            <th style="padding:4px">Medien</th>
            <th class="no-print"></th>
          </tr>
        </thead>
        <tbody>${rows || `<tr><td colspan="5" style="padding:10px; color:var(--muted)">Noch keine Ablaufschritte.</td></tr>`}</tbody>
      </table>
      <div class="btn-row no-print" style="margin-top:12px">
        <button class="btn small secondary" onclick="addSchritt('${c.id}','${s.id}')">+ Ablaufschritt hinzufügen</button>
        <button class="btn small danger" onclick="removeSitzung('${c.id}','${s.id}')">Sitzung löschen</button>
      </div>
    </div>
  `;
}

function addSitzung(courseId) {
  const c = getCourse(courseId);
  c.sitzungen.push({ id: uid(), titel: `Sitzung ${c.sitzungen.length + 1}`, datum: "", schritte: [] });
  saveState();
  render();
}

function updateSitzungField(courseId, sitzungId, field, value) {
  const c = getCourse(courseId);
  const s = c.sitzungen.find(x => x.id === sitzungId);
  if (!s) return;
  s[field] = value;
  saveState();
}

function removeSitzung(courseId, sitzungId) {
  if (!confirm("Diese Sitzung inkl. Ablaufplan wirklich löschen?")) return;
  const c = getCourse(courseId);
  c.sitzungen = c.sitzungen.filter(s => s.id !== sitzungId);
  saveState();
  render();
}

function addSchritt(courseId, sitzungId) {
  const c = getCourse(courseId);
  const s = c.sitzungen.find(x => x.id === sitzungId);
  if (!s) return;
  s.schritte.push({ id: uid(), zeit: "", inhalt: "", methode: "", medien: "" });
  saveState();
  render();
}

function updateSchrittField(courseId, sitzungId, schrittId, field, value) {
  const c = getCourse(courseId);
  const s = c.sitzungen.find(x => x.id === sitzungId);
  if (!s) return;
  const st = s.schritte.find(x => x.id === schrittId);
  if (!st) return;
  st[field] = value;
  saveState();
}

function removeSchritt(courseId, sitzungId, schrittId) {
  const c = getCourse(courseId);
  const s = c.sitzungen.find(x => x.id === sitzungId);
  if (!s) return;
  s.schritte = s.schritte.filter(x => x.id !== schrittId);
  saveState();
  render();
}

function moveSchritt(courseId, sitzungId, schrittId, dir) {
  const c = getCourse(courseId);
  const s = c.sitzungen.find(x => x.id === sitzungId);
  if (!s) return;
  const idx = s.schritte.findIndex(x => x.id === schrittId);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= s.schritte.length) return;
  const tmp = s.schritte[idx];
  s.schritte[idx] = s.schritte[newIdx];
  s.schritte[newIdx] = tmp;
  saveState();
  render();
}

/* ---------- Methodenbaukasten ---------- */
function renderMethodLibrary() {
  const cats = ["Alle", ...METHODEN_KATEGORIEN];
  const list = state.methods.filter(m => methodFilter === "Alle" || m.kategorie === methodFilter);

  const cards = list.map(m => `
    <div class="card">
      <h3>${escapeHtml(m.name)} ${m.custom ? '<span class="tag">eigene</span>' : ''}</h3>
      <div class="meta">${m.gruppengroesse} · ${m.zeitbedarf}</div>
      <div style="font-size:13.5px; margin-bottom:10px; color:var(--text)">${escapeHtml(m.beschreibung)}</div>
      <span class="tag orange">${m.kategorie}</span>
      ${m.custom ? `
        <div class="btn-row" style="margin-top:12px">
          <button class="btn small secondary" onclick="editMethod('${m.id}')">Bearbeiten</button>
          <button class="btn small danger" onclick="deleteMethod('${m.id}')">Löschen</button>
        </div>` : ""}
    </div>
  `).join("");

  return `
    <div class="topbar">
      <h2>Methodenbaukasten</h2>
      <div class="btn-row">
        <button class="btn" onclick="openMethodModal()">+ Neue Methode</button>
      </div>
    </div>
    <div class="filter-row">
      ${cats.map(cat => `<div class="chip ${methodFilter === cat ? 'active' : ''}" onclick="setMethodFilter('${cat}')">${cat}</div>`).join("")}
    </div>
    ${list.length ? `<div class="grid">${cards}</div>` : `<div class="empty">Keine Methoden in dieser Kategorie.</div>`}
    ${modalHtml}
  `;
}

function setMethodFilter(cat) { methodFilter = cat; render(); }

/* ---------- Methoden-Modal (Erstellen/Bearbeiten) ---------- */
let modalHtml = "";
let editingMethodId = null;

function openMethodModal(id) {
  editingMethodId = id || null;
  const m = id ? state.methods.find(x => x.id === id) : { name: "", beschreibung: "", gruppengroesse: "", zeitbedarf: "", kategorie: METHODEN_KATEGORIEN[0] };
  modalHtml = `
    <div class="modal-overlay" onclick="closeModalIfOverlay(event)">
      <div class="modal">
        <h3>${id ? "Methode bearbeiten" : "Neue Methode"}</h3>
        <label>Name</label>
        <input type="text" id="m-name" value="${attr(m.name)}">
        <label>Beschreibung</label>
        <textarea id="m-beschreibung" rows="3">${escapeHtml(m.beschreibung)}</textarea>
        <div class="row2">
          <div>
            <label>Gruppengröße</label>
            <input type="text" id="m-gruppengroesse" value="${attr(m.gruppengroesse)}">
          </div>
          <div>
            <label>Zeitbedarf</label>
            <input type="text" id="m-zeitbedarf" value="${attr(m.zeitbedarf)}">
          </div>
        </div>
        <label>Kategorie</label>
        <select id="m-kategorie">
          ${METHODEN_KATEGORIEN.map(k => `<option value="${k}" ${k === m.kategorie ? "selected" : ""}>${k}</option>`).join("")}
        </select>
        <div class="btn-row" style="margin-top:18px">
          <button class="btn" onclick="saveMethodModal()">Speichern</button>
          <button class="btn secondary" onclick="closeModal()">Abbrechen</button>
        </div>
      </div>
    </div>
  `;
  render();
}

function closeModal() { modalHtml = ""; editingMethodId = null; render(); }
function closeModalIfOverlay(e) { if (e.target.classList.contains("modal-overlay")) closeModal(); }

function saveMethodModal() {
  const data = {
    name: document.getElementById("m-name").value.trim() || "Unbenannte Methode",
    beschreibung: document.getElementById("m-beschreibung").value.trim(),
    gruppengroesse: document.getElementById("m-gruppengroesse").value.trim(),
    zeitbedarf: document.getElementById("m-zeitbedarf").value.trim(),
    kategorie: document.getElementById("m-kategorie").value,
    custom: true
  };
  if (editingMethodId) {
    const m = state.methods.find(x => x.id === editingMethodId);
    Object.assign(m, data);
  } else {
    data.id = uid();
    state.methods.push(data);
  }
  saveState();
  closeModal();
}

function editMethod(id) { openMethodModal(id); }

function deleteMethod(id) {
  if (!confirm("Diese Methode wirklich löschen? Sie wird auch aus allen Kursen entfernt.")) return;
  state.methods = state.methods.filter(m => m.id !== id);
  state.courses.forEach(c => { c.methoden = c.methoden.filter(m => m.methodId !== id); });
  saveState();
  render();
}

/* ---------- Backup Export/Import (zusätzlich zur Supabase-Sync) ---------- */
function exportBackup() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "lehrveranstaltungsplaner-backup-" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
  URL.revokeObjectURL(url);
}

function importBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (!imported.courses || !imported.methods) throw new Error("Ungültiges Format");
      if (confirm("Backup importieren? Der aktuelle Stand wird dabei überschrieben (auch in Supabase).")) {
        state = imported;
        migrateState(state);
        saveState();
        route = { view: "kurse", id: null, tab: "uebersicht" };
        render();
      }
    } catch (err) {
      alert("Diese Datei konnte nicht als Backup gelesen werden.");
    }
  };
  reader.readAsText(file);
  event.target.value = "";
}

/* ---------- Utilities ---------- */
function escapeHtml(str) {
  if (str === undefined || str === null) return "";
  return String(str).replace(/[&<>"']/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]));
}
function attr(str) { return escapeHtml(str); }

/* ---------- Start ---------- */
(async () => {
  const configured = initSupabase();
  if (!configured) showSetupBanner();
  await loadAll();
  render();
})();
</script>
</body>
</html>
